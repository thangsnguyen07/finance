# Production mirror compose file: runs backend, frontend, and isolated database.
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finance-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-finance_db}
      DATABASE_SSL: 'false'
      FRONTEND_URL: http://localhost:3000
    ports:
      - '4000:4000'
    networks:
      - finance-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: finance-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - '3000:3000'
    networks:
      - finance-network
