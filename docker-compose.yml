services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finance_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

networks:
  finance-network:
    name: finance-network
    driver: bridge

volumes:
  postgres_data:
    name: finance-postgres-data
    driver: local
